services:
  web:
    build: .
    image: keaas-global:latest
    container_name: keaas-global-web
    restart: unless-stopped
    # No host ports published — reached only via kannanware's nginx,
    # which proxies to this container by name over the shared network below.
    networks:
      - shared_web

networks:
  shared_web:
    external: true
